# Configuración de despliegue en Netlify para PresupuestosPro.
# Solo se usa cuando Netlify construye desde el repositorio Git
# (no en un deploy manual con arrastrar-y-soltar la carpeta dist/).

[build]
  command = "npm run build"
  publish = "dist"

# SPA con React Router: cualquier ruta desconocida debe servir index.html
# para que el enrutado del cliente funcione al entrar o recargar.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
